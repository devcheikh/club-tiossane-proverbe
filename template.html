<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proverbe Wolof du Jour — Club Tiossane</title>
  <style>
    :root {
      --bg: #fdfaf5;
      --card: #ffffff;
      --primary: #00853f;
      --accent: #e31b23;
      --gold: #d4a017;
      --text: #1f2937;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 680px;
      width: 100%;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      background: rgba(0, 133, 63, 0.1);
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .date {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      border-top: 5px solid var(--primary);
      position: relative;
    }
    .wolof {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.35;
      margin-bottom: 1.25rem;
    }
    .traduction {
      font-size: 1.15rem;
      font-style: italic;
      color: var(--text);
      padding-bottom: 1.25rem;
      border-bottom: 1px solid #f3f4f6;
      margin-bottom: 1.25rem;
    }
    .signification-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .signification {
      line-height: 1.6;
      color: #374151;
    }
    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">🌍 Club Tiossane • Patrimoine & Culture</div>
      <h1>Proverbe Wolof du Jour</h1>
      <p class="date">Édition du {{DATE}}</p>
    </header>

    <main class="card">
      <p class="wolof">« {{WOLOF}} »</p>
      <p class="traduction">{{TRADUCTION}}</p>
      <div class="signification-label">💡 Signification & Sagesse</div>
      <p class="signification">{{SIGNIFICATION}}</p>
    </main>

    <footer>
      Propulsé automatiquement par GitHub Actions •
      <a href="https://github.com/{{REPO}}" target="_blank" rel="noopener">Contribuer un proverbe</a>
    </footer>
  </div>
</body>
</html>
